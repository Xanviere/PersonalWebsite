<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to GitHub...</title>
  <script>
    const USER_ID = "157901589";
    const FALLBACK_USERNAME = "Xanviere";

    async function redirect() {
      const urlParams = new URLSearchParams(window.location.search);
      const repo = urlParams.get("repo") || urlParams.get("r");

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        const response = await fetch(`https://api.github.com/user/${USER_ID}`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (response.ok) {
          const data = await response.json();
          const username = data.login || FALLBACK_USERNAME;
          const targetUrl = repo 
            ? `https://github.com/${username}/${repo}`
            : (data.html_url || `https://github.com/${username}`);
          window.location.replace(targetUrl);
          return;
        }
      } catch (e) {
        // Fallback on timeout, rate-limit, or network error
      }

      const fallbackUrl = repo 
        ? `https://github.com/${FALLBACK_USERNAME}/${repo}`
        : `https://github.com/${FALLBACK_USERNAME}`;
      window.location.replace(fallbackUrl);
    }

    redirect();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #fafafc;
      color: #545b6b;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <p>Redirecting to GitHub...</p>
</body>
</html>
